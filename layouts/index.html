<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; background-color: #fcfcfc; }
        @media (prefers-color-scheme: dark) { body { color: #e0e0e0; background-color: #121212; } a { color: #8ab4f8; } }
        .site-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 0.5rem; }
        .site-logo-link { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
        .site-logo { height: 42px; width: 42px; border-radius: 8px; object-fit: cover; }
        h1 { font-size: 2.2rem; font-weight: 700; margin: 0; }
        .description { font-size: 1.1rem; color: #666; margin-bottom: 3rem; }
        @media (prefers-color-scheme: dark) { .description { color: #aaa; } }
        .post-item { margin-bottom: 2rem; list-style: none; padding-left: 0; }
        .post-title { font-size: 1.4rem; font-weight: 600; text-decoration: none; color: inherit; }
        .post-title:hover { text-decoration: underline; }
        .post-date { font-size: 0.9rem; color: #888; display: block; margin-top: 0.2rem; }
        ul { padding-left: 0; }
    </style>
</head>
<body>
    <header>
        <div class="site-heading">
            <a href="/" class="site-logo-link">
                <img src="/favicon.jpg" alt="{{ .Site.Title }}" class="site-logo">
            </a>
            <h1>{{ .Site.Title }}</h1>
        </div>
        <p class="description">{{ .Site.Params.description }}</p>
    </header>
    <main>
        <ul>
            {{ range .Site.RegularPages }}
            <li class="post-item">
                <a class="post-title" href="{{ .Permalink }}">{{ .Title }}</a>
                <span class="post-date">{{ .Date.Format "January 2, 2006" }}</span>
            </li>
            {{ end }}
        </ul>
    </main>
</body>
</html>
