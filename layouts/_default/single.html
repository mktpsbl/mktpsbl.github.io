<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.7; color: #333; background-color: #fcfcfc; font-size: 1.1rem; }
        @media (prefers-color-scheme: dark) { body { color: #e0e0e0; background-color: #121212; } a { color: #8ab4f8; } }
        .back-link { display: inline-block; margin-bottom: 2rem; text-decoration: none; color: #0066cc; font-size: 0.95rem; }
        @media (prefers-color-scheme: dark) { .back-link { color: #8ab4f8; } }
        h1 { font-size: 2.4rem; line-height: 1.2; margin-bottom: 0.5rem; font-weight: 700; }
        .meta { font-size: 0.9rem; color: #777; margin-bottom: 3rem; }
    </style>
</head>
<body>
    <a class="back-link" href="{{ .Site.BaseURL }}">&larr; Back to Home</a>
    <main>
        <header>
            <h1>{{ .Title }}</h1>
            <div class="meta">Published on {{ .Date.Format "January 2, 2006" }} by {{ .Site.Params.author }}</div>
        </header>
        <article>
            {{ .Content }}
        </article>
    </main>
</body>
</html>
