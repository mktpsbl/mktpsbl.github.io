<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #333;
            background-color: #fcfcfc;
        }
        @media (prefers-color-scheme: dark) {
            body { color: #e0e0e0; background-color: #121212; }
            a { color: #8ab4f8; }
            .post-date { color: #aaa; }
        }
        h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .description { font-size: 1.1rem; color: #666; margin-bottom: 3rem; }
        @media (prefers-color-scheme: dark) { .description { color: #aaa; } }
        .post-item { margin-bottom: 2rem; list-style: none; padding-left: 0; }
        .post-title { font-size: 1.4rem; font-weight: 600; text-decoration: none; color: inherit; }
        .post-title:hover { text-decoration: underline; }
        .post-date { font-size: 0.9rem; color: #888; display: block; margin-top: 0.2rem; }
    </style>
</head>
<body>
    <header>
        <h1>{{ .Site.Title }}</h1>
        <p class="description">{{ .Site.Params.description }}</p>
    </header>
    <main>
        <ul>
            {{ range .Site.RegularPages }}
            <li class="post-item">
                <a class="post-title" href="{{ .Permalink }}">{{ .Title }}</a>
                <span class="post-date">{{ .Date.Format "January 2, 2006" }}</span>
            </li>
            {{ end }}
        </ul>
    </main>
</body>
</html>
